<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيتزيريا بوقرة - باتنة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ddb347;--dim:#a8883a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#000;color:var(--y);font-family:Cairo,Tahoma,sans-serif;line-height:1.8;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{text-align:center;padding:24px 0 8px}
header img{width:min(300px,78%);height:auto;display:block;margin:0 auto}
.tag{font-size:1.1rem;margin:0 0 12px}
.btn{display:inline-block;border:2px solid var(--y);background:#000;padding:6px 24px;font-weight:800;font-size:1rem;cursor:pointer}
.btn.fill{background:var(--y);color:#000}
.btn:hover{background:var(--y);color:#000}
.btn.fill:hover{background:#000;color:var(--y)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:0 14px;font-size:.9rem}
h2{text-align:center;font-weight:800;font-size:1.8rem;margin:40px 0 4px}
h2:after{content:"";display:block;width:60px;height:2px;background:var(--y);margin:8px auto 0}
h3{font-size:1.2rem;font-weight:800;margin:26px 0 4px;border-bottom:1px solid var(--dim)}
.item{display:flex;align-items:center;gap:8px;margin:12px 0}
.item b{font-weight:600}
.item small{display:block;color:var(--dim);font-size:.82rem;line-height:1.4;font-weight:400}
.item i{flex:1;border-bottom:2px dotted var(--dim);min-width:12px}
.item span{font-weight:800;white-space:nowrap}
.q{display:flex;align-items:center;gap:6px}
.q button{width:32px;height:32px;border:2px solid var(--y);background:#000;font-weight:800;font-size:1.1rem;cursor:pointer;line-height:1}
.q em{min-width:20px;text-align:center;font-style:normal;font-weight:800}
.bar{position:fixed;inset:auto 0 0 0;background:#000;border-top:2px solid var(--y);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.bar[hidden]{display:none}
.center{text-align:center}
.spin{width:60px;height:60px;border:4px solid var(--dim);border-top-color:var(--y);border-radius:50%;margin:30px auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.check{width:90px;height:90px;border-radius:50%;background:var(--y);color:#000;font-size:3.4rem;font-weight:800;line-height:90px;margin:30px auto}
.box{border:1px solid var(--y);padding:12px 16px;margin:14px 0}
.msg{margin:4px 0;font-size:.95rem}
.msg.w{color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=password]{flex:1;min-width:0;background:#000;border:2px solid var(--y);padding:6px 12px}
.note{color:var(--dim);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center}
footer{text-align:center;color:var(--dim);font-size:.85rem;padding:36px 0 16px}
footer button{background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:.85rem}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

<div id="st"></div>
<div class="box" style="text-align:right"><b>طلبك:</b><div id="mine"></div></div>
<div class="box" style="text-align:right"><b>رسائل للعامل</b><div id="mm"></div>
<div class="row"><input type="text" id="mi" placeholder="مثلا: زيادة مايونيز" maxlength="120"><button class="btn fill sm" id="ms">إرسال</button></div></div>
<button class="btn" id="again" hidden>طلب جديد</button>
</div>

<div id="login" class="wrap center" hidden>
<h2>دخول العامل</h2>
<div class="row"><input type="password" id="code" inputmode="numeric" placeholder="اكتب الكود" autocomplete="off"><button class="btn fill sm" id="go">دخول</button></div>
<p id="bad" class="note" hidden>الكود غير صحيح</p>
<p><button class="btn sm" data-back>رجوع</button></p>
</div>

<div id="work" class="wrap" hidden>
<div class="top"><h2 style="margin:24px 0">الطلبات</h2><button class="btn sm" id="out">خروج</button></div>
<div id="orders"></div>
</div>

<footer id="foot">© بيتزيريا بوقرة<br><button id="wbtn">تسجيل كعامل</button></footer>

<script>
const MENU=[["البيتزا",[["مارغريتا","صلصة طماطم، جبن موزاريلا",500],["تونة","تونة، زيتون، جبن",600],["دجاج","دجاج، فطر، جبن",700],["بيبروني","نقانق بيبروني، جبن",750],["أربع فصول","لحم مفروم، تونة، دجاج، خضر",800],["أربع أجبان","موزاريلا، شيدر، إيمنتال، جبن أزرق",850],["بوقرة الخاصة","تشكيلة اللحوم والخضر مع صلصة البيت",1000]]],["ساندويتشات وسلطات",[["بانيني دجاج","",350],["بانيني تونة","",300],["سلطة مشكلة","",250]]],["المشروبات",[["مشروب غازي","",100],["عصير","",120],["ماء","",50]]]];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P={};MENU.forEach(g=>g[1].forEach(i=>P[i[0]]=i[2]));
const cart={};let db=null,myId=null,last=null,unM=null,unW=null;
const sv=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const VIEWS=["shop","wait","login","work"];
function show(v){VIEWS.forEach(x=>$("#"+x).hidden=x!==v);$("#foot").hidden=v==="wait";scrollTo(0,0)}
// menu
$("#menu").innerHTML=MENU.map(g=>"<h3>"+g[0]+"</h3>"+g[1].map(i=>`<div class="item"><div><b>${i[0]}</b>${i[1]?"<small>"+i[1]+"</small>":""}</div><i></i><span>${i[2]} دج</span><div class="q" data-n="${i[0]}"><button data-d="1" aria-label="زيادة">+</button><em>0</em><button data-d="-1" aria-label="نقصان">−</button></div></div>`).join("")).join("");
$("#menu").onclick=e=>{const b=e.target.closest("button[data-d]");if(!b)return;const n=b.parentNode.dataset.n;cart[n]=Math.max(0,(cart[n]||0)+ +b.dataset.d);if(!cart[n])delete cart[n];b.parentNode.querySelector("em").textContent=cart[n]||0;upd()};
function total(c){return Object.entries(c).reduce((s,[n,q])=>s+P[n]*q,0)}
function upd(){const q=Object.values(cart).reduce((a,b)=>a+b,0);$("#bar").hidden=!q;$("#cnt").textContent=q+" صنف";$("#tot").textContent=total(cart)+" دج"}
const lines=items=>items.map(i=>`<div>${i.q} × ${esc(i.n)}</div>`).join("");
const tm=t=>new Date(t).toLocaleTimeString("ar-DZ",{hour:"2-digit",minute:"2-digit"});
const msgs=(m,me)=>(m||[]).map(x=>`<div class="msg ${x.f==="w"?"w":""}">${x.f===me?"أنت":x.f==="w"?"العامل":"الزبون"}: ${esc(x.t)}</div>`).join("")||'<div class="note">لا رسائل</div>';
// customer
$("#send").onclick=async()=>{
 if(!db)return alert("نظام الطلبات غير متاح حاليا");
 const items=Object.entries(cart).map(([n,q])=>({n,q}));
 $("#send").disabled=true;
 try{const ref=db.collection("orders").doc();
  await ref.set({items,total:total(cart),status:"pending",msgs:[],at:Date.now()});
  myId=ref.id;sv("oid",myId);watchMine();
 }catch(e){alert("تعذر إرسال الطلب، حاول مرة أخرى")}
 $("#send").disabled=false};
function watchMine(){if(unM)unM();show("wait");
 unM=db.collection("orders").doc(myId).onSnapshot(s=>{
  if(!s.exists){return resetMine()}
  const d=last=s.data(),ok=d.status==="accepted";
  $("#st").innerHTML=ok?'<div class="check">✓</div><h2 style="margin-top:0">تم قبول طلبك</h2>':'<div class="spin"></div><h2 style="margin-top:0">بانتظار موافقة العامل...</h2>';
  $("#mine").innerHTML=lines(d.items)+"<b>"+d.total+" دج</b>";
  $("#mm").innerHTML=msgs(d.msgs,"c");$("#again").hidden=!ok;
 },()=>{})}
function resetMine(){if(unM)unM();unM=null;myId=null;last=null;sv("oid",null);for(const k in cart)delete cart[k];$$(".q em").forEach(e=>e.textContent=0);upd();show("shop")}
$("#again").onclick=resetMine;
$("#ms").onclick=async()=>{const t=$("#mi").value.trim();if(!t||!last)return;$("#mi").value="";
 try{await db.collection("orders").doc(myId).update({msgs:[...(last.msgs||[]),{f:"c",t,at:Date.now()}]})}catch(e){alert("تعذر إرسال الرسالة")}};
// worker
$("#wbtn").onclick=()=>{if(ld("w")==="1")return enter();$("#code").value="";$("#bad").hidden=true;show("login")};
$$("[data-back]").forEach(b=>b.onclick=()=>show("shop"));
$("#go").onclick=()=>{if($("#code").value.trim()==="1115"){sv("w","1");enter()}else $("#bad").hidden=false};
$("#code").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
function enter(){show("work");if(!db){$("#orders").innerHTML='<p class="note center">نظام الطلبات غير متاح</p>';return}
 if(unW)unW();
 unW=db.collection("orders").orderBy("at","desc").limit(100).onSnapshot(s=>{
  const keep={};$$("[data-r]").forEach(i=>keep[i.dataset.r]=i.value);
  const L=s.docs.map(d=>({id:d.id,...d.data()}));
  $("#orders").innerHTML=L.length?L.map(o=>`<div class="box"><div class="top"><b>طلب ${tm(o.at)}</b><span>${o.status==="accepted"?"✓ مقبول":"جديد"}</span></div>${lines(o.items)}<b>${o.total} دج</b><div style="margin-top:8px">${msgs(o.msgs,"w")}</div><div class="row"><input type="text" data-r="${o.id}" placeholder="رد على الزبون" maxlength="120"><button class="btn sm" data-reply="${o.id}">رد</button></div><div class="row">${o.status==="accepted"?"":`<button class="btn fill" data-ok="${o.id}">قبول ✓</button>`}<button class="btn sm" data-del="${o.id}">حذف</button></div></div>`).join(""):'<p class="note center">لا توجد طلبات بعد</p>';
  $$("[data-r]").forEach(i=>{if(keep[i.dataset.r])i.value=keep[i.dataset.r]});
  window._L=L;
 },()=>{$("#orders").innerHTML='<p class="note center">تعذر تحميل الطلبات</p>'})}
$("#orders").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 try{if(d.ok)await db.collection("orders").doc(d.ok).update({status:"accepted"});
 if(d.del&&confirm("حذف هذا الطلب؟"))await db.collection("orders").doc(d.del).delete();
 if(d.reply){const i=$(`[data-r="${d.reply}"]`),t=i.value.trim(),o=(window._L||[]).find(x=>x.id===d.reply);if(t&&o){i.value="";await db.collection("orders").doc(o.id).update({msgs:[...(o.msgs||[]),{f:"w",t,at:Date.now()}]})}}
 }catch(err){alert("تعذر تنفيذ العملية")}};
$("#out").onclick=()=>{if(unW)unW();unW=null;sv("w",null);show("shop")};
// init
(async()=>{try{db=await claude.use("db")}catch(e){}
 myId=ld("oid");if(db&&myId)watchMine()})();
</script>
</body>
</html>
